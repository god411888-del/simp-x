<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080710"><title>SIMP X! Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#080609;color:#f4eeee;font:15px system-ui,Arial;min-height:100vh}.wrap{max-width:850px;margin:auto}.card{background:#151014;border:1px solid #54242b;border-radius:16px;padding:22px;margin:16px 0}h1{color:#ff5264}input{width:100%;padding:13px;border-radius:9px;background:#090609;border:1px solid #63303a;color:white;margin:8px 0 12px}button{padding:11px 16px;border-radius:9px;border:1px solid #d34b5a;background:#8d0b18;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.muted{color:#bbaeb1;font-size:13px}.request{border-top:1px solid #45242b;padding:16px 0}.pill{color:#ff9aa5;font-size:12px;font-weight:800}.code{font-size:20px;letter-spacing:3px;color:#fff;background:#080609;padding:10px;border-radius:8px;display:inline-block;margin:8px 0}
</style></head><body><div class="wrap"><h1>SIMP X! / ADMIN PANEL</h1><p class="muted">Review submitted follow-proof requests. Approve only after you have checked the visitor's screenshot in WhatsApp.</p>
<div class="card"><label>Admin secret</label><input id="secret" type="password" placeholder="Enter your Cloudflare SIMP_X_ADMIN_SECRET"><button id="load">LOAD REQUESTS</button><p id="status" class="muted"></p></div>
<div class="card"><h2>Pending & approved requests</h2><div id="requests" class="muted">Sign in to load requests.</div></div></div>
<script>
const $=id=>document.getElementById(id);let secret="";
async function call(path,options={}){const r=await fetch("/api/"+path,{...options,headers:{"Content-Type":"application/json","x-admin-secret":secret,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){secret=$("secret").value.trim();$("status").textContent="Loading…";try{const d=await call("admin-requests");$("status").textContent="Loaded "+d.requests.length+" request(s).";$("requests").innerHTML=d.requests.length?d.requests.map(x=>`<div class="request"><b>${escapeHtml(x.name)}</b> · ${escapeHtml(x.phone)}<br><span class="pill">${escapeHtml(x.status.toUpperCase())}</span><br><small>${escapeHtml(x.createdAt)}</small>${x.status==="pending"?`<p><button data-id="${x.requestId}">APPROVE & GENERATE CODE</button></p>`:x.accessCode?`<div class="code">${escapeHtml(x.accessCode)}</div><br><small>Share this code privately with ${escapeHtml(x.name)}. ${x.redeemedAt?"Already used.":"Not yet redeemed."}</small>`:""}</div>`).join(""):"No requests yet.";document.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>approve(b.dataset.id,b)));}catch(e){$("status").textContent=e.message;}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function approve(id,button){button.disabled=true;try{const d=await call("approve-request",{method:"POST",body:JSON.stringify({requestId:id})});alert("Access code for "+d.name+": "+d.code+"\nSend it to "+d.phone);await load();}catch(e){alert(e.message);button.disabled=false;}}
$("load").addEventListener("click",load);
</script></body></html>
